name: Web Build + Deployment to GitHub Pages 

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_NUMBER: 1
  BUILD_VERSION: 1.0.0
  PYTHON_VERSION: 3.12.8
  FLET_CLI_VERSION: 0.27.5
  PYTHONUTF8: 1
  FLET_CLI_NO_RICH_OUTPUT: 1
  UV_NO_PROGRESS: 1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install flet-cli ${{ env.FLET_CLI_VERSION }}
      run: |
        python -m pip install --upgrade pip
        pip install flet-cli==$FLET_CLI_VERSION

    - name: Flet Build Web
      run: |
        echo "Building for GitHub Pages..."
        # Use empty base URL for root deployment
        flet build web --base-url "" --route-url-strategy hash

    - name: Fix index.html for GitHub Pages
      run: |
        # Backup the original index.html
        cp build/web/index.html build/web/index_original.html
        
        # Create a proper index.html that loads the Flet app
        echo '<!DOCTYPE html>
        <html>
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Flet Web App</title>
            <script type="module" crossorigin src="./assets/index.js"></script>
            <link rel="stylesheet" href="./assets/index.css">
        </head>
        <body>
            <script>
                // Handle GitHub Pages root URL redirect
                if (window.location.pathname === "/" && window.location.hash === "") {
                    window.location.hash = "/";
                }
            </script>
            <div id="root"></div>
        </body>
        </html>' > build/web/index.html

    - name: Upload Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        name: web-build-artifact
        path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Deploy to GitHub Pages 🚀
        if: github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@v4.0.5
        with:
          artifact_name: web-build-artifact
